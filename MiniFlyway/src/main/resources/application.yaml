spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: miniFlyway
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/seeder
    baseline-on-migrate: true
    clean-disabled: false
    validate-on-migrate: true
