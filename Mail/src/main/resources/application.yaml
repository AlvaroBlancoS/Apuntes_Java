server:
  port: 8080
spring:
  application:
    name: Mail
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: TRACE      

