server:
  port: 8081
spring:
  application:
    name: User
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect    
        format_sql: true
  logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: TRACE             
