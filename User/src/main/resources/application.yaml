server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always  
spring:
  application:
    name: User
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect    
        format_sql: true
  logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: TRACE             
