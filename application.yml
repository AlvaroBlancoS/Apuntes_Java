server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ejemplo
    username: ****
    password: ****

#
#Instruciones para ddl-auto
#- create: crea las tablas al iniciar la aplicacion, pero no las elimina automaticamente al detenerle
#- create-drop:Crea las tablas al iniciar la aplicacion, pero las elimina al finalizarla.---
#- update: Solo actualiza el esquema existente, agregando o modificando tablas y columnas sin eliminarlas.
#- Validate: Valida que el esquema existente coincida con las entidades de JPA, pero no hace cambios.
#

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: TRACE

